[workspace]
resolver = "2"
members = [
    "crates/forge",
    "crates/forge-process",
    "crates/forge-terminal",
    "crates/forge-tui",
    "crates/forge-agent",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/forge-dev/forge"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "process"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
portable-pty = "0.9"
vt100 = "0.16"
ratatui = "0.30"
tui-term = "0.3"
crossterm = { version = "0.29", features = ["event-stream"] }
nix = { version = "0.30", features = ["signal", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
